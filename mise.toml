[settings]
dotfiles.root = "~/vault/dotfiles"
dotfiles.default_mode = "symlink"

[dotfiles]
"~/.zshrc" = {}
"~/.zprofile" = {}
"~/.config/zsh" = {}
"~/.config/mise" = {}
"~/.config/starship.toml" = {}
"~/.config/atuin/config.toml" = {}
"~/.ssh/config" = {}
"~/.gitconfig" = {}
"~/.bunfig.toml" = {}
"~/.config/pnpm" = {}
"~/.config/ghostty" = {}
"~/.aerospace.toml" = {}
"~/.claude/CLAUDE.md" = {}
"~/.claude/skills/japanese-tech-writing" = {}
"~/.claude/skills/cognitive-rhythm-writing" = {}
"~/.githooks" = {}
"~/.local/bin/ssh-sign" = { mode = "copy", mode_bits = "0755" }
"~/.local/bin/home-audit" = { mode = "copy", mode_bits = "0755" }
"~/.local/bin/statusline-command.sh" = { mode = "copy", mode_bits = "0755" }
"~/.config/borders/bordersrc" = { mode = "copy", mode_bits = "0755" }

[bootstrap.packages]
"brew:git" = "latest"
"brew:eza" = "latest"
"brew:jq" = "latest"
"brew:libpq" = "latest"
"brew-cask:1password" = "latest"
"brew-cask:session-manager-plugin" = "latest"
"brew-cask:1password-cli" = "latest"
"brew-cask:google-chrome" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:google-japanese-ime" = "latest"
"brew-cask:raycast" = "latest"
"brew-cask:font-moralerspace" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:obsidian" = "latest"

[tasks.aerospace]
description = "Install AeroSpace via Homebrew CLI"
run = "brew list --cask aerospace &>/dev/null || brew install --cask nikitabobko/tap/aerospace"

[tasks.sbx]
description = "Install Docker Sandboxes via Homebrew CLI"
run = """
brew list --formula sbx &>/dev/null || {
  brew trust --formula docker/tap/sbx
  brew install docker/tap/sbx
}
"""

[tasks.borders]
description = "Install JankyBorders via Homebrew CLI"
run = """
brew list --formula borders &>/dev/null || {
  brew trust --formula FelixKratz/formulae/borders
  brew install FelixKratz/formulae/borders
}
"""

[tasks.ecsk]
description = "Install ecsk via Homebrew CLI"
run = """
brew list --formula ecsk &>/dev/null || {
  brew trust --formula yukiarrr/tap/ecsk
  brew install yukiarrr/tap/ecsk
}
"""

[tasks.brew-extras]
description = "Install packages that require the Homebrew CLI"
depends = ["aerospace", "sbx", "borders", "ecsk"]

[tasks.macos-keyrepeat]
description = "Set macOS key repeat rate"
run = """
defaults write NSGlobalDomain KeyRepeat -int 2
defaults write NSGlobalDomain InitialKeyRepeat -int 15
"""

[tasks.macos-trackpad]
description = "Set macOS trackpad behavior (tap to click, two-finger secondary click, three-finger drag)"
run = """
for domain in com.apple.AppleMultitouchTrackpad com.apple.driver.AppleBluetoothMultitouch.trackpad; do
  defaults write "$domain" Clicking -bool true
  defaults write "$domain" TrackpadRightClick -bool true
  defaults write "$domain" TrackpadCornerSecondaryClick -int 0
  defaults write "$domain" TrackpadThreeFingerDrag -bool true
done

defaults write NSGlobalDomain com.apple.mouse.tapBehavior -int 1
defaults -currentHost write NSGlobalDomain com.apple.mouse.tapBehavior -int 1
defaults -currentHost write NSGlobalDomain com.apple.trackpad.enableSecondaryClick -bool true
defaults -currentHost write NSGlobalDomain com.apple.trackpad.trackpadCornerClickBehavior -int 0
"""

[tasks.macos-defaults]
description = "Apply all macOS defaults settings (key repeat, trackpad)"
depends = ["macos-keyrepeat", "macos-trackpad"]

[tasks.git-signing-key]
description = "Generate a Secure Enclave signing key for git"
run = """
set -euo pipefail
if [ -f ~/.ssh/id_git_sign ]; then
  echo "already exists: ~/.ssh/id_git_sign"
  exit 0
fi
sc_auth create-ctk-identity -l git-sign -k p-256-ne -t none
tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
cd "$tmp"
ssh-keygen -w /usr/lib/ssh-keychain.dylib -K -N ""
mkdir -p ~/.ssh
mv id_ecdsa_sk_rk ~/.ssh/id_git_sign
mv id_ecdsa_sk_rk.pub ~/.ssh/id_git_sign.pub
echo "--- register this at https://github.com/settings/keys as a Signing key ---"
cat ~/.ssh/id_git_sign.pub
"""
